# ── BoonesBot — docker-compose.yml ────────────────────────────────────────────
# Lokaal draaien:  docker compose up -d --build
# Stoppen:         docker compose down
# Logs bekijken:   docker compose logs -f
# ──────────────────────────────────────────────────────────────────────────────

services:
  boonesbot:
    build: .
    image: deglimlachfabriek/boonesbot:latest
    container_name: boonesbot

    # Herstart automatisch na een crash of na een herstart van de machine
    restart: unless-stopped

    # Laad geheimen uit .env (zie .env.example)
    env_file:
      - .env

    # Beperk de container tot het minimum
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Geen healthcheck: de bot gebruikt long-polling en heeft geen poort.
    # Als het proces stopt, start Docker het opnieuw op via 'restart' hierboven.
